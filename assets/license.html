<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Attivazione</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Solo impaginazione: colori, font e misure vengono dai token di style.css */
        body { align-items: center; justify-content: center; padding: 24px; }
        .card {
          width: 100%; max-width: 420px; padding: 28px 26px;
          background: var(--surface-1); border: 1px solid var(--border);
          border-radius: var(--radius-l); box-shadow: var(--shadow-pop), var(--hairline);
          animation: popIn var(--t-slow) var(--ease);
        }
        h1 { font-family: var(--font-display); font-size: var(--fs-xl); font-weight: 600; margin-bottom: 6px; }
        p  { font-size: var(--fs-s); color: var(--text-3); line-height: 1.55; margin-bottom: 18px; }
        input {
          width: 100%; height: var(--h-control); padding: 0 12px; margin-bottom: 12px;
          border: 1px solid var(--border); border-radius: var(--radius-s);
          background: var(--bg); color: var(--text); letter-spacing: 1px;
          font-family: var(--font-mono);
        }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
        button { width: 100%; }
        #msg { margin-top: 12px; font-size: var(--fs-s); min-height: 18px; text-align: center; }
        .ok  { color: var(--success); }
        .err { color: var(--danger); }
    </style>
</head>
<body>
<div class="card">
    <h1>Inserisci la tua licenza</h1>
    <p>Hai ricevuto un codice di attivazione. Inseriscilo qui sotto per sbloccare l'applicazione.</p>
    <input id="tokenInput" type="text" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" />
    <button class="btn btn-primary" id="btnActivate">Attiva</button>
    <div id="msg"></div>
</div>

<script>
    const btn   = document.getElementById("btnActivate");
    const input = document.getElementById("tokenInput");
    const msg   = document.getElementById("msg");

    btn.onclick = async () => {
      const token = input.value.trim();
      if (!token) {
        msg.className = "err";
        msg.textContent = "Inserisci un codice di attivazione.";
        return;
      }

      btn.disabled = true;
      msg.className = "";
      msg.textContent = "Verifica in corso...";

      try {
        const result = await window.pywebview.api.insert_license(token);
        if (result && result.ok) {
          msg.className = "ok";
          msg.textContent = `Licenza attivata, valida fino al ${result.expires}. Chiudi questa finestra e riapri PrenotazioniCN.`;
          btn.textContent = "Chiudi";
          btn.disabled = false;
          input.disabled = true;
          btn.onclick = async () => {
            try { await window.pywebview.api.chiudi_finestra(); }
            catch (e) { msg.textContent = "Chiudi la finestra dalla X in alto a destra e riapri l'app."; }
          };
        } else {
          msg.className = "err";
          msg.textContent = (result && result.error) || "Codice non valido.";
          btn.disabled = false;
        }
      } catch(e) {
        msg.className = "err";
        msg.textContent = "Errore di comunicazione con il backend.";
        btn.disabled = false;
      }
    };

    input.addEventListener("keydown", e => {
      if (e.key === "Enter") btn.click();
    });
</script>
</body>
</html>
